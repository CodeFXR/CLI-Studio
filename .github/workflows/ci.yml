name: CI

on:
  push:
    branches: [main, master, CLI-Studio]
  pull_request:
    branches: [main, master, CLI-Studio]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick libimage-exiftool-perl tesseract-ocr tesseract-ocr-eng mkvtoolnix zbar-tools rename rclone handbrake-cli chafa

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy .

      - name: Pytest
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "Production repo layout: tests directory omitted from release."
          fi
